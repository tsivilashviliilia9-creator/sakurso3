<!-- fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<header>
  <div class="logo"><div class="logo">
  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="36" viewBox="0 0 24 24" fill="#666eea">
    <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
  </svg>
</div></div>

  <nav class="navBar">
    <ul>
      <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active">About</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
      <li><a routerLink="/cart" routerLinkActive="active">ჩემი დაჯავშნილი</a></li>
    </ul>
  </nav>

  <div class="logIn">
    <div class="aikon"></div>

    @if (isLoggedIn()) {
      <button class="logInbtn" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path fill="rgb(255,255,255)" d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 192 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l210.7 0-73.4 73.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l128-128zM160 96c17.7 0 32-14.3 32-32s-14.3-32-32-32L96 32C43 32 0 75 0 128L0 384c0 53 43 96 96 96l64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0c-17.7 0-32-14.3-32-32l0-256c0-17.7 14.3-32 32-32l64 0z"/>
        </svg>
        <p>Log Out</p>
      </button>
    } @else {
      <button class="logInbtn" routerLink="/log-in">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path fill="rgb(255, 255, 255)" d="M406.5 399.6C387.4 352.9 341.5 320 288 320l-64 0c-53.5 0-99.4 32.9-118.5 79.6-35.6-37.3-57.5-87.9-57.5-143.6 0-114.9 93.1-208 208-208s208 93.1 208 208c0 55.7-21.9 106.2-57.5 143.6zm-40.1 32.7C334.4 452.4 296.6 464 256 464s-78.4-11.6-110.5-31.7c7.3-36.7 39.7-64.3 78.5-64.3l64 0c38.8 0 71.2 27.6 78.5 64.3zM256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zm0-272a40 40 0 1 1 0-80 40 40 0 1 1 0 80zm-88-40a88 88 0 1 0 176 0 88 88 0 1 0 -176 0z"/>
        </svg>
        <p>Log In</p>
      </button>
    }
  </div>

  <button class="burgerBtn" (click)="toggleMenu()" [class.active]="isMenuOpen()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="mobileNav" [class.open]="isMenuOpen()">
    <a routerLink="/home" (click)="closeMenu()">Home</a>
    <a routerLink="/about" (click)="closeMenu()">About</a>
    <a routerLink="/contact" (click)="closeMenu()">Contact</a>
    <a routerLink="/cart" (click)="closeMenu()">ჩემი დაჯავშნილი</a>

    @if (isLoggedIn()) {
      <a (click)="logout(); closeMenu()" style="cursor:pointer">Log Out</a>
    } @else {
      <a routerLink="/log-in" (click)="closeMenu()">Log In</a>
    }
  </nav>
</header>
